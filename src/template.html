<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>采蝶轩门店分布</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cg%20transform%3D%22translate(16%2016)%20scale(1.13)%20translate(-16%20-16)%22%3E%3Cpath%20d%3D%22M9.4%2016h13.2l-2%2010.9a2.3%202.3%200%200%201-2.3%201.8h-4.6a2.3%202.3%200%200%201-2.3-1.8z%22%20fill%3D%22%23B7242C%22%2F%3E%3Cpath%20d%3D%22M7.6%2016.2c0-4.9%203.7-7.9%208.4-7.9s8.4%203%208.4%207.9z%22%20fill%3D%22%23F2DDBB%22%2F%3E%3Cpath%20d%3D%22M9%2015.9c0-4.1%203.1-6.6%207-6.6s7%202.5%207%206.6z%22%20fill%3D%22%23FCF2E2%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%227.6%22%20r%3D%222.5%22%20fill%3D%22%23E5443F%22%2F%3E%3Ccircle%20cx%3D%2215.2%22%20cy%3D%226.8%22%20r%3D%22.75%22%20fill%3D%22%23ffffff%22%20opacity%3D%22.6%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<script>
  // 首屏前定主题，避免闪白
  (function () {
    try {
      var t = localStorage.getItem('cdx-theme');
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#2A2320;background:#FBF8F3}
  .app{display:flex;height:100vh;height:100dvh}

  /* ---------- 左侧面板 ---------- */
  aside{width:392px;flex:0 0 392px;display:flex;flex-direction:column;
    background:#FFFDFA;border-right:1px solid #EDE4D9;z-index:2}
  .brand{padding:22px 22px 14px}
  .brand h1{margin:0;font-size:19px;letter-spacing:.5px;font-weight:700;display:flex;align-items:center;gap:9px}
  .brand h1 .dot{width:9px;height:9px;border-radius:50%;background:#B7242C;box-shadow:0 0 0 3px rgba(183,36,44,.12)}
  .brand p{margin:7px 0 0;font-size:12px;color:#9A8D84;line-height:1.6}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#EDE4D9;
    border-top:1px solid #EDE4D9;border-bottom:1px solid #EDE4D9;margin-top:16px}
  .stat{background:#FFFDFA;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:21px;font-weight:700;letter-spacing:-.5px;color:#B7242C;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:#9A8D84}

  .filters{padding:13px 22px 12px;border-bottom:1px solid #F2EAE0}
  .modes{display:flex;gap:2px;background:#F5EEE5;border-radius:9px;padding:3px;margin-bottom:11px}
  .modes button{flex:1;border:0;background:transparent;font:inherit;font-size:12px;color:#7A6E66;
    padding:6px 4px;border-radius:7px;cursor:pointer;transition:.16s;white-space:nowrap}
  .modes button:hover{color:#2A2320}
  .modes button.on{background:#fff;color:#B7242C;font-weight:600;box-shadow:0 1px 3px rgba(90,60,40,.10)}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips.dchips{margin-top:8px;flex-wrap:wrap;border-top:1px dashed #EEE3D7;padding-top:9px}
  .chips.dchips .chip.all-mark{background:#F7F1E9;border-color:#E6DCD0}
  .chips.dchips .chip{font-size:11.5px;padding:4px 8px;gap:4px}
  .chips.dchips .chip .n{font-size:10px}
  .chip{border:1px solid #E6DCD0;background:#fff;color:#5C524B;font-size:12px;
    padding:5px 10px;border-radius:999px;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:5px}
  .chip:hover{border-color:#CFC1B2}
  .chip .n{font-size:11px;color:#A99C92;font-variant-numeric:tabular-nums}
  .chip.on{background:#B7242C;border-color:#B7242C;color:#fff}
  .chip.on .n{color:rgba(255,255,255,.72)}
  .chip i{width:6px;height:6px;border-radius:50%;display:inline-block}

  .search{margin-top:11px;position:relative}
  .search input{width:100%;height:34px;border:1px solid #E6DCD0;border-radius:9px;
    padding:0 32px 0 11px;font-size:12.5px;background:#fff;color:#2A2320;outline:none;transition:.16s}
  .search input:focus{border-color:#B7242C;box-shadow:0 0 0 3px rgba(183,36,44,.07)}
  .search .x{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:15px;
    color:#BEB0A4;cursor:pointer;line-height:1;display:none}

  .list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 10px 24px}
  .list::-webkit-scrollbar{width:6px}
  .list::-webkit-scrollbar-thumb{background:#E2D6C8;border-radius:3px}
  .item{padding:11px 12px;border-radius:10px;cursor:pointer;transition:.14s;border:1px solid transparent}
  .item:hover{background:#F8F2EA}
  .item.on{background:#FDF1F0;border-color:#F2D3D0}
  .item .row1{display:flex;align-items:baseline;gap:7px}
  .item .nm{font-size:13.5px;font-weight:600;letter-spacing:.2px}
  .item .cd{font-size:10.5px;color:#B5A79C;font-variant-numeric:tabular-nums;margin-left:auto}
  .item .ad{font-size:11.5px;color:#8B7F76;margin-top:4px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .mt{font-size:11px;color:#B0A398;margin-top:5px;display:flex;gap:11px}
  .item .city{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;flex:0 0 auto;
    max-width:86px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .empty{padding:36px 16px;text-align:center;color:#B0A398;font-size:12.5px}

    .switch{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#5C524B;
    cursor:pointer;user-select:none;line-height:1}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .switch .track{width:32px;height:18px;border-radius:999px;background:#E6DCD0;position:relative;
    transition:.18s;flex:0 0 auto}
  .switch .track::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .switch input:checked + .track{background:#B7242C}
  .switch input:checked + .track::after{transform:translateX(14px)}
  .switch em{font-style:normal;color:#A99C92;font-size:11px}
  /* 底图详略切换 */
  .baserow{display:flex;align-items:center;gap:9px;margin-top:12px}
  .baserow .bl{font-size:12px;color:#5C524B;flex:0 0 auto;line-height:1}
  .seg{display:flex;gap:2px;background:#F5EEE5;border-radius:8px;padding:2px;flex:1}
  .seg button{flex:1;border:0;background:transparent;font:inherit;font-size:11.5px;color:#7A6E66;
    padding:4px 0;border-radius:6px;cursor:pointer;transition:.15s;white-space:nowrap}
  .seg button:hover{color:#2A2320}
  .seg button.on{background:#fff;color:#B7242C;font-weight:600;box-shadow:0 1px 2px rgba(90,60,40,.10)}
  .ringsum{display:none;margin-top:9px;background:#FDF7F1;border:1px solid #F0E2D4;border-radius:8px;
    padding:8px 10px;font-size:11px;color:#7A6E66;line-height:1.75}
  .ringsum b{color:#B7242C;font-weight:600}
  .ringsum .cf{margin-top:4px;color:#B5A79C;font-size:10.5px}

/* ---------- 地图 ---------- */
  main{position:relative;flex:1;min-width:0;background:#F2EDE5}
  #map{position:absolute;inset:0}
  /* 腾讯地图 2D 视图下旋转控件不可点击，却占据右上角 100x197，隐藏其容器 */
  #map div:has(> [class*="rotate-"]){display:none!important}
  /* 底图加载失败兜底：只写浅色一套，深色模式由 #map 的反相滤镜自动得到深底浅字 */
  .map-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:7px;background:#FBF6EF;color:#6E6058;font-size:12.5px;
    text-align:center;padding:28px;z-index:6;line-height:1.7}
  .map-fallback b{font-size:14.5px;color:#2A231E;font-weight:700}
  .map-fallback .hint{font-size:11.5px;color:#A0938A}
  .map-tip{position:absolute;left:14px;top:14px;z-index:3;background:rgba(255,253,250,.94);
    border:1px solid #E9DFD3;border-radius:10px;padding:9px 12px;font-size:11.5px;color:#7A6E66;
    line-height:1.6;backdrop-filter:blur(8px);max-width:280px}
  .map-tip b{color:#B7242C;font-weight:600}
  .legend{position:absolute;right:14px;bottom:14px;z-index:3;background:rgba(255,253,250,.94);
    border:1px solid #E9DFD3;border-radius:10px;padding:10px 12px;backdrop-filter:blur(8px);
    max-height:calc(100% - 120px);overflow:auto;max-width:190px}
  .legend .lg-h{font-size:10.5px;color:#A99C92;letter-spacing:.4px;margin-bottom:5px}
  .legend .row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6E635B;line-height:1.85}
  .legend .row span{margin-left:auto;color:#B5A79C;font-variant-numeric:tabular-nums}
  .legend i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .legend .more{font-size:10.5px;color:#B5A79C;margin-top:4px;line-height:1.5}
  .legend .bar{width:132px;height:9px;border-radius:5px;margin:6px 0 4px;
    background:linear-gradient(90deg,#F7E7CE,#F0B357 45%,#DE7A3A 75%,#B7242C)}
  .legend .bl{display:flex;justify-content:space-between;font-size:10px;color:#A99C92}
  /* 移动端图例折叠按钮（桌面隐藏，由媒体查询打开） */
  .legend-btn{display:none;position:absolute;right:10px;bottom:10px;z-index:5;
    align-items:center;justify-content:center;height:28px;padding:0 11px;border-radius:14px;
    border:1px solid #E9DFD3;background:rgba(255,253,250,.95);color:#7A6E66;
    font:inherit;font-size:11.5px;cursor:pointer;backdrop-filter:blur(8px);
    box-shadow:0 2px 8px rgba(90,60,40,.10)}

  /* 信息窗 */
  .iw{padding:2px 4px 4px;min-width:186px;color:#2A231E}
  .iw h4{margin:0 0 6px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;color:#2A231E}
  .iw .tag{font-size:10px;font-weight:500;color:#fff;padding:1px 6px;border-radius:4px;flex:0 0 auto}
  .iw p{margin:0;font-size:11.5px;color:#6E6058;line-height:1.65}
  .iw .kv{margin-top:7px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px}
  .iw .kv b{color:#7C6D62;font-weight:400}
  .iw .kv span{color:#3A322C;font-variant-numeric:tabular-nums}

  /* ---------- 黑夜模式 ---------- */
  .brand-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand-top h1{min-width:0}
  .theme-btn{flex:0 0 auto;width:30px;height:30px;border-radius:9px;
    border:1px solid #E6DCD0;background:#fff;color:#7A6E66;font-size:14px;line-height:1;
    cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center}
  .theme-btn:hover{border-color:#CFC1B2;color:#B7242C}

  [data-theme="dark"]{color-scheme:dark}
  [data-theme="dark"] body{background:#14100D;color:#EDE5DC}
  [data-theme="dark"] aside{background:#1B1613;border-right-color:#2E2620}
  [data-theme="dark"] .brand h1{color:#F2EAE1}
  [data-theme="dark"] .brand p{color:#8E8076}
  [data-theme="dark"] .theme-btn{background:#241E19;border-color:#332A23;color:#C9BCB0}
  [data-theme="dark"] .theme-btn:hover{color:#F0919A;border-color:#463A31}
  [data-theme="dark"] .stats{background:#2E2620;border-color:#2E2620}
  [data-theme="dark"] .stat{background:#1B1613}
  [data-theme="dark"] .stat b{color:#E8616A}
  [data-theme="dark"] .stat span{color:#8E8076}
  [data-theme="dark"] .filters{border-bottom-color:#252019}
  [data-theme="dark"] .modes{background:#241E19}
  [data-theme="dark"] .modes button{color:#9C8F84}
  [data-theme="dark"] .modes button.on{background:#332A23;color:#F0919A;box-shadow:none}
  [data-theme="dark"] .chip{background:#241E19;border-color:#332A23;color:#C9BCB0}
  [data-theme="dark"] .chip .n{color:#7E7268}
  [data-theme="dark"] .chip:hover{border-color:#463A31}
  [data-theme="dark"] .chip.on{background:#B7242C;border-color:#B7242C;color:#fff}
  [data-theme="dark"] .chips.dchips{border-top-color:#2A231D}
  [data-theme="dark"] .chips.dchips .chip.all-mark{background:#211B17;border-color:#332A23}
  [data-theme="dark"] .search input{background:#241E19;border-color:#332A23;color:#EDE5DC}
  [data-theme="dark"] .search input::placeholder{color:#6F645B}
  [data-theme="dark"] .search input:focus{border-color:#B7242C;box-shadow:0 0 0 3px rgba(183,36,44,.22)}
  [data-theme="dark"] .search .x{color:#6F645B}
  [data-theme="dark"] .switch{color:#C9BCB0}
  [data-theme="dark"] .switch .track{background:#3A3029}
  [data-theme="dark"] .switch em{color:#7E7268}
  [data-theme="dark"] .baserow .bl{color:#C9BCB0}
  [data-theme="dark"] .seg{background:#241E19}
  [data-theme="dark"] .seg button{color:#9C8F84}
  [data-theme="dark"] .seg button:hover{color:#EDE5DC}
  [data-theme="dark"] .seg button.on{background:#332A23;color:#F0919A;box-shadow:none}
  [data-theme="dark"] .ringsum{background:#221B17;border-color:#332A23;color:#B7A99D}
  [data-theme="dark"] .ringsum .cf{color:#7A6E64}
  [data-theme="dark"] .list::-webkit-scrollbar-thumb{background:#3A3029}
  [data-theme="dark"] .item:hover{background:#221C17}
  [data-theme="dark"] .item.on{background:#2B1D1C;border-color:#4A2C2A}
  [data-theme="dark"] .item .nm{color:#F0E8DF}
  [data-theme="dark"] .item .ad{color:#95877C}
  [data-theme="dark"] .item .mt{color:#7E7268}
  [data-theme="dark"] .item .cd{color:#6F645B}
  [data-theme="dark"] .empty{color:#7E7268}
  [data-theme="dark"] main{background:#0F0C0A}
  [data-theme="dark"] .legend,[data-theme="dark"] .map-tip{background:rgba(27,22,19,.94);border-color:#332A23;color:#B7A99D}
  [data-theme="dark"] .legend .lg-h{color:#7E7268}
  [data-theme="dark"] .legend .row{color:#B7A99D}
  [data-theme="dark"] .legend .row span{color:#7E7268}
  [data-theme="dark"] .legend .more,[data-theme="dark"] .legend .bl{color:#7E7268}
  [data-theme="dark"] .legend-btn{background:rgba(27,22,19,.95);border-color:#332A23;color:#B7A99D}
  [data-theme="dark"] .map-tip b{color:#E8616A}
  /* 底图靠反相近似夜间配色（不使用需白名单的 mapStyleId） */
  [data-theme="dark"] #map{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(1.14) saturate(.92)}
  /* 信息窗整块被反相：颜色令牌已按「反转后再看」预设，此处保证文字不继承主题色 */
  [data-theme="dark"] .iw{color:#2A231E}
  /* 标记图标是 SVG data URI，被父级反相后会把白字变黑，这里再反相一次还原原色 */
  [data-theme="dark"] #map img[src^="data:image/svg+xml"]{filter:invert(1) hue-rotate(180deg)}

  @media (max-width:900px){
    .app{flex-direction:column}
    aside{width:100%;flex:1 1 auto;min-height:0;order:2;border-right:none;
      border-top:1px solid #EDE4D9;overflow:hidden}
    main{order:1;flex:0 0 38vh;min-height:240px}

    /* 顶部信息压缩，把纵向空间让给列表 */
    .brand{padding:11px 16px 7px}
    .brand h1{font-size:16px}
    .theme-btn{width:26px;height:26px;border-radius:8px;font-size:13px}
    .brand p{display:none}
    .stats{margin-top:7px}
    .stat{padding:7px 4px}
    .stat b{font-size:16px}
    .stat span{font-size:10px}
    .filters{padding:9px 16px 10px}
    .modes{margin-bottom:8px}
    .modes button{font-size:11.5px;padding:5px 0}
    .search{margin-top:8px}
    .search input{height:32px;font-size:12px}
    .baserow{margin-top:9px}
    .switch{margin-top:8px}

    /* 筛选条改单行横向滑动，避免换行吃掉整个屏幕（dchips 需单独指定，特异性更高） */
    .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding-bottom:3px;
      scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .chips.dchips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden}
    .chips::-webkit-scrollbar{display:none}
    .chips .chip{flex:0 0 auto}

    .map-tip{display:none}
    .legend{display:none;padding:8px 10px;right:10px;bottom:54px;max-width:160px;
      max-height:calc(100% - 66px);overflow:auto}
    .legend.open{display:block}
    .legend-btn{display:flex}
    .list{padding:4px 10px 28px;min-height:0}
  }
</style>
<script type="text/javascript">
  window._TMapSecurityConfig = {
    serviceHost: 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__',
  };
</script>
<script src="https://map.qq.com/api/gljs?v=1.exp&libraries=visualization"></script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="brand-top">
        <h1><span class="dot"></span>采蝶轩 · 门店分布</h1>
        <button class="theme-btn" id="theme" title="切换深色 / 浅色">☾</button>
      </div>
      <p>中山市采蝶轩食品有限公司 直营门店<br>数据取自「采蝶轩会员」小程序门店接口</p>
    </div>

    <div class="stats">
      <div class="stat"><b id="s-total">—</b><span>门店总数</span></div>
      <div class="stat"><b id="s-city">—</b><span>覆盖城市</span></div>
      <div class="stat"><b id="s-area">—</b><span>区县镇</span></div>
    </div>

    <div class="filters">
      <div class="modes" id="modes">
        <button data-mode="city">按城市</button>
        <button data-mode="district">按区县</button>
        <button data-mode="heat">热力图</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="chips dchips" id="dchips" style="display:none"></div>
      <div class="baserow">
        <span class="bl">底图</span>
        <div class="seg" id="base">
          <button data-b="min">仅路网</button>
          <button data-b="mid">含路名</button>
          <button data-b="full">完整</button>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="ring">
        <span class="track"></span>
        5km 服务圈 <em>看覆盖盲区</em>
      </label>
      <div class="ringsum" id="ringsum"></div>
      <div class="search">
        <input id="q" type="text" placeholder="搜门店名 / 地址，如「小榄」「大石」">
        <span class="x" id="qx">×</span>
      </div>
    </div>

    <div class="list" id="list"></div>
  </aside>

  <main>
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <button class="legend-btn" id="legendBtn" type="button">图例</button>
    <div class="map-tip" id="tip"></div>
  </main>
</div>

<script>
/* ============ 数据 ============ */
const STORES = /*__DATA__*/[];
const CITY_COLORS = {
  '中山市': '#B7242C',
  '佛山市': '#E07A2E',
  '广州市': '#2F6F8F',
  '江门市': '#5E8C61',
  '珠海市': '#8A6BAF',
};
const CITY_ORDER = Object.keys(CITY_COLORS);

/* ============ 区县配色：黄金角散开色相，相邻区县不撞色 ============ */
const districtKey = (s) => (s.district ? s.city + '/' + s.district : s.city + '/未标注');
const DISTRICT_COLOR = (() => {
  const cnt = {};
  STORES.forEach((s) => { const k = districtKey(s); cnt[k] = (cnt[k] || 0) + 1; });
  const keys = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  const map = {};
  keys.forEach((k, i) => { map[k] = 'hsl(' + Math.round((i * 137.508) % 360) + ',58%,45%)'; });
  return map;
})();

/* ============ 状态 ============ */
/* 底图详略：features 决定腾讯地图渲染哪些要素，不传 point 即不画商铺 POI */
const BASE_FEATURES = {
  min: ['base', 'building2d'],           // 只要路网骨架
  mid: ['base', 'building2d', 'label'],  // 加道路名，仍不显示商铺 POI
  full: null,                            // 不传 features = 全部要素
};

let savedBase = 'mid';
try { savedBase = localStorage.getItem('cdx-base') || 'mid'; } catch (e) {}
if (!BASE_FEATURES.hasOwnProperty(savedBase)) savedBase = 'mid';

const state = { city: 'all', district: 'all', q: '', sel: null, zoom: 9, mode: 'city', ring: false, base: savedBase };
let map, markerLayer, heatLayer, infoWindow, clustered = false, lastRenderZoom = 9;

/* ============ 工具 ============ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function match(s) {
  if (state.city !== 'all' && s.city !== state.city) return false;
  if (state.mode === 'district' && state.district !== 'all' && s.district !== state.district) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return (s.name + s.addr + s.district + s.code).toLowerCase().includes(q);
}
const view = () => STORES.filter(match);
const colorOf = (s) => (state.mode === 'district' ? (DISTRICT_COLOR[districtKey(s)] || '#8A7E77') : CITY_COLORS[s.city]);

/* ============ 统计 ============ */

/* ============ 城市 / 区县筛选 ============ */
function renderChips() {

  const items = [{ k: 'all', label: '全部', n: STORES.length, color: null }]

  $('#chips').innerHTML = items.map((it) => '<div class="chip ' + (state.city === it.k ? 'on' : '') + '" data-city="' + it.k + '">' +

    list.map(([d, n]) => '<div class="chip ' + (state.district === d ? 'on' : '') + '" data-d="' + esc(d) + '">' +
      '<i style="background:' + (DISTRICT_COLOR[districtKey(pool.find((s) => s.district === d))] || '#8A7E77') + '"></i>' +

/* ============ 图标 ============ */
function iconUrl(color, size, label) {
  const svg = label
    ? '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + (size / 2 - 2) + '" fill="' + color + '" fill-opacity=".92" stroke="#fff" stroke-width="2.5"/>' +
      '<text x="50%" y="50%" dy=".35em" text-anchor="middle" font-family="system-ui,sans-serif" font-size="' + (size * 0.4) + '" font-weight="700" fill="#fff">' + label + '</text></svg>'
    : '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + (size / 2 - 2) + '" fill="' + color + '" stroke="#fff" stroke-width="2.5"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============ 热力层 ============ */
function updateHeat(rows) {
  const data = rows.map((s) => ({ lat: s.lat, lng: s.lng, count: 1 }));
  if (!heatLayer) {
    heatLayer = new TMap.visualization.Heat({
      radius: 30,
      height: 30,
      gradientColor: { 0: '#F7E7CE', 0.45: '#F0B357', 0.75: '#DE7A3A', 1: '#B7242C' },
    }).addTo(map);
  }
  heatLayer.setData(data);
}
function removeHeat() {
  if (!heatLayer) return;
  try { heatLayer.remove(); } catch (e) { try { heatLayer.setMap(null); } catch (e2) {} }
  heatLayer = null;
}

/* ============ 覆盖圈 / 内部空洞 ============ */
const K_LAT = 110540, K_LNG = 111320;
function distM(lng1, lat1, lng2, lat2) {
  const dx = (lng2 - lng1) * K_LNG * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
  const dy = (lat2 - lat1) * K_LAT;
  return Math.sqrt(dx * dx + dy * dy);
}
let NN = null;
function nnStats() {
  if (NN) return NN;
  let lone = 0, crowded = 0;
  STORES.forEach((s) => {
    let m = Infinity;
    for (const o of STORES) {
      if (o.id === s.id) continue;
      const d = distM(s.lng, s.lat, o.lng, o.lat);
      if (d < m) m = d;
    }
    if (m > 5000) lone++;
    else if (m < 300) crowded++;
  });
  NN = { lone: lone, crowded: crowded };
  return NN;
}
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const q of p) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
    lower.push(q);
  }
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) {
    const q = p[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
    upper.push(q);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
function inPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
let GAPS = null;
function computeGaps() {
  if (GAPS) return GAPS;
  const hull = convexHull(STORES.map((s) => [s.lng, s.lat]));
  const lngs = STORES.map((s) => s.lng), lats = STORES.map((s) => s.lat);
  const step = 0.02;
  const cells = {};
  let inside = 0;
  for (let lng = Math.min.apply(null, lngs); lng < Math.max.apply(null, lngs); lng += step) {
    for (let lat = Math.min.apply(null, lats); lat < Math.max.apply(null, lats); lat += step) {
      const cx = lng + step / 2, cy = lat + step / 2;
      if (!inPoly(cx, cy, hull)) continue;
      inside++;
      let m = Infinity;
      for (const s of STORES) {
        const d = distM(cx, cy, s.lng, s.lat);
        if (d < m) m = d;
      }
      if (m > 5000) cells[Math.round(lng / step) + '_' + Math.round(lat / step)] = { lng: cx, lat: cy };
    }
  }
  const seen = {}, blobs = [];
  Object.keys(cells).forEach((k) => {
    if (seen[k]) return;
    const stack = [k], group = [];
    seen[k] = 1;
    while (stack.length) {
      const cur = stack.pop();
      group.push(cells[cur]);
      const gp = cur.split('_');
      const gx = +gp[0], gy = +gp[1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let i = 0; i < nb.length; i++) {
        const nk = (gx + nb[i][0]) + '_' + (gy + nb[i][1]);
        if (cells[nk] && !seen[nk]) { seen[nk] = 1; stack.push(nk); }
      }
    }
    blobs.push(group);
  });
  const cellKm2 = (step * K_LNG * Math.cos(22.5 * Math.PI / 180) / 1000) * (step * K_LAT / 1000);
  const gapCells = Object.keys(cells).length;
  GAPS = {
    blobs: blobs.map((g) => ({
      lng: g.reduce((a, c) => a + c.lng, 0) / g.length,
      lat: g.reduce((a, c) => a + c.lat, 0) / g.length,
      area: g.length * cellKm2,
    })).sort((a, b) => b.area - a.area),
    rate: inside ? 1 - gapCells / inside : 0,
  };
  return GAPS;
}

let ringLayer = null, gapLayer = null;
function syncRings(rows) {
  if (!map || !window.TMap) return;
  if (ringLayer) { ringLayer.setMap(null); ringLayer = null; }
  if (gapLayer) { gapLayer.setMap(null); gapLayer = null; }
  if (!state.ring) return;

  ringLayer = new TMap.MultiCircle({
    map: map,
    zIndex: 4,
    styles: {
      r: new TMap.CircleStyle({
        color: 'rgba(183,36,44,0.055)', showBorder: true,
        borderColor: 'rgba(183,36,44,0.20)', borderWidth: 1,
      }),
    },
    geometries: rows.map((s) => ({
      id: 'r' + s.id, styleId: 'r', center: new TMap.LatLng(s.lat, s.lng), radius: 5000,
    })),
  });

  const g = computeGaps();
  if (g.blobs.length) {
    gapLayer = new TMap.MultiCircle({
      map: map,
      zIndex: 5,
      styles: {
        g: new TMap.CircleStyle({
          color: 'rgba(90,80,72,0.05)', showBorder: true,
          borderColor: 'rgba(120,110,100,0.45)', borderWidth: 1.5,
        }),
      },
      geometries: g.blobs.map((b, i) => ({
        id: 'g' + i, styleId: 'g',
        center: new TMap.LatLng(b.lat, b.lng),
        radius: Math.sqrt(b.area * 1e6 / Math.PI),
      })),
    });
  }
}

function updateRingSum() {
  const box = $('#ringsum');
  if (!state.ring) { box.style.display = 'none'; return; }
  const g = computeGaps();
  const st = nnStats();
  const area = g.blobs.reduce((a, b) => a + b.area, 0);
  box.style.display = 'block';
  box.innerHTML = '5km 覆盖格占凸包 <b>' + Math.round(g.rate * 100) + '%</b> · 内部空洞 <b>' + g.blobs.length +
    '</b> 处（约 ' + Math.round(area) + ' km²）<br>孤岛店（5km 无邻店）<b>' + st.lone +
    '</b> 家 · 300m 内成对有 <b>' + st.crowded + '</b> 家' +
    '<div class="cf">空洞含山体、水道等非居住区，仅反映网点形态</div>';
}

let ringTimer = null;
function scheduleRings() {
  clearTimeout(ringTimer);
  ringTimer = setTimeout(() => syncRings(view()), 300);
}

/* ============ 标记 ============ */
function renderMarkers() {
  if (!map || !window.TMap) return;
  const rows = view();

  if (markerLayer) { markerLayer.setMap(null); markerLayer = null; }

  if (state.mode === 'heat') { updateHeat(rows); return; }
  removeHeat();

  const doCluster = state.zoom < 10.5 && rows.length > 80;
  clustered = doCluster;

  const styles = {};
  const geoms = [];

  if (doCluster) {
    const cell = state.zoom < 9 ? 0.35 : state.zoom < 10 ? 0.18 : 0.09;
    const grid = {};
    rows.forEach((s) => {
      const k = Math.round(s.lng / cell) + '_' + Math.round(s.lat / cell);
      if (!grid[k]) grid[k] = { lng: 0, lat: 0, n: 0, ids: [], pal: {} };
      const g = grid[k];
      g.lng += s.lng; g.lat += s.lat; g.n++; g.ids.push(s.id);
      const c = colorOf(s);
      g.pal[c] = (g.pal[c] || 0) + 1;
    });
    Object.entries(grid).forEach(([k, g], i) => {
      const color = Object.entries(g.pal).sort((a, b) => b[1] - a[1])[0][0];
      const size = g.n >= 40 ? 46 : g.n >= 15 ? 40 : 32;
      const sid = 'c' + i;
      styles[sid] = new TMap.MarkerStyle({ width: size, height: size, anchor: { x: size / 2, y: size / 2 }, src: iconUrl(color, size, g.n) });
      geoms.push({ id: 'k' + k, styleId: sid, position: new TMap.LatLng(g.lat / g.n, g.lng / g.n), properties: { cluster: g.ids } });
    });
  } else {
    rows.forEach((s) => {
      const c = colorOf(s);
      if (!styles[c]) styles[c] = new TMap.MarkerStyle({ width: 15, height: 15, anchor: { x: 7.5, y: 7.5 }, src: iconUrl(c, 15) });
      const on = c + '|on';
      if (!styles[on]) styles[on] = new TMap.MarkerStyle({ width: 24, height: 24, anchor: { x: 12, y: 12 }, src: iconUrl(c, 24) });
    });
    rows.forEach((s) => {
      const c = colorOf(s);
      geoms.push({
        id: String(s.id),
        styleId: state.sel === s.id ? c + '|on' : c,
        position: new TMap.LatLng(s.lat, s.lng),
        properties: { store: s.id },
      });
    });
  }

  markerLayer = new TMap.MultiMarker({ map: map, styles: styles, geometries: geoms, zIndex: 10 });
  markerLayer.on('click', (evt) => {
    const p = (evt.geometry && evt.geometry.properties) || {};
    if (p.cluster) {
      const ids = p.cluster;
      const sum = ids.reduce((a, id) => {
        const s = STORES.find((x) => x.id === id);
        return [a[0] + s.lng, a[1] + s.lat];
      }, [0, 0]);
      map.setCenter(new TMap.LatLng(sum[1] / ids.length, sum[0] / ids.length));
      map.setZoom(Math.min(13, state.zoom + 2));
      return;
    }
    if (p.store) select(p.store);
  });
}

/* ============ 选中 ============ */
function select(id) {
  const s = STORES.find((x) => x.id === id);
  if (!s) return;
  if (state.city !== 'all' && s.city !== state.city) { state.city = 'all'; renderChips(); }
  state.sel = id;
  renderStats(); renderList();
  if (state.mode !== 'heat') renderMarkers();

  const el = document.querySelector('.item[data-id="' + id + '"]');
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  map.setCenter(new TMap.LatLng(s.lat, s.lng));
  if (state.zoom < 13) map.setZoom(14);

  infoWindow.setContent(
    '<div class="iw"><h4><span class="tag" style="background:' + CITY_COLORS[s.city] + '">' +
    esc(s.district || s.city.replace('市', '')) + '</span>' + esc(s.name) + '</h4>' +
    '<p>' + esc(s.addr) + '</p><div class="kv">' +
    '<b>城市</b><span>' + esc(s.city) + '</span>' +
    '<b>编号</b><span>' + esc(s.code) + '</span>' +
    '<b>电话</b><span>' + esc(s.tel) + '</span>' +
    '<b>营业</b><span>' + esc(s.open) + '</span>' +
    '<b>坐标</b><span>' + s.lng.toFixed(5) + ', ' + s.lat.toFixed(5) + '</span>' +
    '</div></div>');
  infoWindow.setPosition(new TMap.LatLng(s.lat, s.lng));
  infoWindow.open();
}

/* ============ 视野 ============ */
function flyTo() {
  const rows = view();
  if (!rows.length) return;
  const lngs = rows.map((r) => r.lng), lats = rows.map((r) => r.lat);
  const cLng = (Math.min.apply(null, lngs) + Math.max.apply(null, lngs)) / 2;
  const cLat = (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2;
  const span = Math.max(
    Math.max.apply(null, lngs) - Math.min.apply(null, lngs),
    (Math.max.apply(null, lats) - Math.min.apply(null, lats)) * 1.35
  );
  const zoom = span > 1.6 ? 9.4 : span > 1.0 ? 10 : span > 0.55 ? 10.7 : span > 0.3 ? 11.5 : span > 0.15 ? 12.3 : 13;
  map.setCenter(new TMap.LatLng(cLat, cLng));
  map.setZoom(zoom);
  state.zoom = zoom;
  lastRenderZoom = zoom;
}

/* ============ 底图详略 ============ */
function baseMapOpt() {
  const f = BASE_FEATURES[state.base];
  return f ? { type: 'vector', features: f } : { type: 'vector' };
}
function applyBase() {
  if (!map || !window.TMap) return;
  try { map.setBaseMap(baseMapOpt()); } catch (e) {}
}
function renderBase() {
  const box = $('#base');
  if (!box) return;
  box.querySelectorAll('button').forEach((b) => {
    b.classList.toggle('on', b.dataset.b === state.base);
  });
  try { localStorage.setItem('cdx-base', state.base); } catch (e) {}
}

/* 旋转控件容器没有类名可定位，靠子元素反查并隐藏到 #map 的直接子层
   （CSS :has() 已处理新内核，这里兜底旧版安卓 WebView） */
function hideRotateControl() {
  let tries = 0;
  const tick = () => {
    const el = document.querySelector('#map [class*="rotate-left"]');
    if (!el) return false;
    const mapEl = document.getElementById('map');
    let node = el;
    while (node.parentElement && node.parentElement !== mapEl) node = node.parentElement;
    if (node !== el) node.style.display = 'none';
    return true;
  };
  if (tick()) return;
  const timer = setInterval(() => {
    if (tick() || ++tries > 20) clearInterval(timer);
  }, 300);
}

/* ============ 初始化 ============ */
function initMap() {
  const lng = STORES.reduce((a, s) => a + s.lng, 0) / STORES.length;
  const lat = STORES.reduce((a, s) => a + s.lat, 0) / STORES.length;

  map = new TMap.Map('map', {
    center: new TMap.LatLng(lat, lng),
    zoom: 9,
    viewMode: '2D',
    showControl: true,
    pitch: 0,
    rotation: 0,
  });

  infoWindow = new TMap.InfoWindow({
    map: map,
    position: new TMap.LatLng(lat, lng),
    content: '',
    offset: { x: 0, y: -16 },
    enableCustom: true,
  });
  infoWindow.close();

  // 缩放联动：轮询判断，跨过聚合阈值或缩放变化较大时重绘
  setInterval(() => {
    if (!map || state.mode === 'heat') return;
    const z = map.getZoom();
    if (Math.abs(z - lastRenderZoom) < 0.01) return;
    const crossed = (lastRenderZoom < 10.5) !== (z < 10.5);
    state.zoom = z;
    if (crossed || (z < 10.5 && Math.abs(z - lastRenderZoom) >= 0.7)) {
      lastRenderZoom = z;
      renderMarkers();
    }
  }, 350);

  renderModes(); renderChips(); renderStats(); renderList();
  flyTo(); renderMarkers(); renderLegend(); renderTip();
  renderBase(); applyBase(); hideRotateControl();
}

/* 深色 / 浅色 */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const btn = $('#theme');
  if (btn) btn.textContent = t === 'dark' ? '☀' : '☾';
  try { localStorage.setItem('cdx-theme', t); } catch (e) {}
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem('cdx-theme'); } catch (e) {}
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  applyTheme(t);
})();
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
};

/* 底图详略 */
document.querySelectorAll('#base button').forEach((b) => {
  b.onclick = () => {
    if (state.base === b.dataset.b) return;
    state.base = b.dataset.b;
    renderBase();
    applyBase();
  };
});

/* 移动端图例折叠（桌面端按钮不显示，图例始终展开） */
(function () {
  const btn = document.getElementById('legendBtn');
  const lg = document.getElementById('legend');
  if (!btn || !lg) return;
  btn.onclick = () => {
    const open = lg.classList.toggle('open');
    btn.textContent = open ? '收起' : '图例';
  };
})();

/* 覆盖圈开关 */
$('#ring').addEventListener('change', (e) => {
  state.ring = e.target.checked;
  syncRings(view());
  updateRingSum();
});

/* 搜索 */
$('#q').addEventListener('input', (e) => {
  state.q = e.target.value.trim();
  $('#qx').style.display = state.q ? 'block' : 'none';
  renderStats(); renderList(); renderMarkers(); renderLegend(); scheduleRings();
});
$('#qx').onclick = () => {
  $('#q').value = ''; state.q = ''; $('#qx').style.display = 'none';
  renderStats(); renderList(); renderMarkers(); renderLegend(); scheduleRings();
};

/* 底图加载失败时给出明确说明，避免只看到一个空白矩形 */
function mapFallback(msg) {
  const el = document.getElementById('map');
  if (!el || el.dataset.failed) return;
  el.dataset.failed = '1';
  const d = document.createElement('div');
  d.className = 'map-fallback';
  d.innerHTML = '<b>底图未能加载</b><span>' + msg + '</span>' +
    '<span class="hint">左侧的门店列表、筛选与统计仍可正常使用</span>';
  el.appendChild(d);
}

/* 启动：SDK 未就绪时不要静默失败 */
(function boot() {
  let started = false;
  const start = () => {
    if (started || !window.TMap) return;
    started = true;
    try { initMap(); } catch (e) {
      mapFallback('地图初始化出错：' + (e && e.message ? e.message : e));
    }
  };
  if (window.TMap) start();
  else window.addEventListener('load', start);
  setTimeout(() => {
    if (!started) mapFallback('地图服务没有响应，可能是网络受限或底图密钥未生效。');
  }, 9000);
})();
</script>
